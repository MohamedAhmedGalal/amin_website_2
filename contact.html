  <title>Contact – AMIN</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .contact-page {
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(120deg, #0a192f, #1e3a8a);
      color: white;
    }
    .contact-box {
      background: white;
      color: #222;
      display: inline-block;
      padding: 40px 60px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin-top: 40px;
      text-align: left;
      max-width: 500px;
    }
    .contact-box h3 {
      color: #1e3a8a;
      margin-bottom: 20px;
    }
    .contact-box p {
      margin: 10px 0;
      font-size: 1.1em;
    }
    .contact-box a {
      color: #00bcd4;
      text-decoration: none;
    }
    .contact-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
